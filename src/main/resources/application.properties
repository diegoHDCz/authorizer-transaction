spring.application.name=mini-authorizer

# MySQL do docker-compose.yml (banco miniautorizador, root sem senha) - ADR-0001
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/miniautorizador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA: o schema é responsabilidade do Liquibase; o Hibernate apenas valida o mapeamento - ADR-0004
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase - ADR-0004
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Credenciais HTTP Basic exigidas pelo contrato (login username / senha password)
spring.security.user.name=${API_USERNAME:username}
spring.security.user.password=${API_PASSWORD:password}

# Contrato: respostas de erro sem stack trace nem mensagens internas
server.error.include-stacktrace=never
server.error.include-message=never
