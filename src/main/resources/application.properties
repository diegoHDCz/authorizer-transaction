spring.application.name=mini-authorizer

# MySQL from docker-compose.yml (database miniautorizador, root without password) - ADR-0001
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/miniautorizador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA: the schema is owned by Liquibase; Hibernate only validates the mapping - ADR-0004
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase - ADR-0004
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# HTTP Basic credentials required by the contract (login username / password password)
spring.security.user.name=${API_USERNAME:username}
spring.security.user.password=${API_PASSWORD:password}

# Contract: error responses without stack traces or internal messages
server.error.include-stacktrace=never
server.error.include-message=never
